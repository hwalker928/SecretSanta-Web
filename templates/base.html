<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Secret Santa {{config["year"]}}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <style>
      :root {
        --ss-red: #c0392b;
        --ss-red-dark: #962d22;
        --ss-green: #1e7e4f;
      }

      body {
        min-height: 100vh;
        padding: 16px;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        background: linear-gradient(160deg, #fdf3f1 0%, #eaf5ee 100%);
        color: #2c3e50;
      }

      .content {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 20px 32px;
        text-align: center;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      .content img {
        display: block;
        margin: 8px auto 16px;
        max-width: 100%;
        height: auto;
      }

      .content h2,
      .content h3,
      .content p {
        margin-bottom: 16px;
      }

      .btn {
        margin-top: 10px;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 600;
      }

      .btn-primary {
        background: var(--ss-red);
        border-color: var(--ss-red);
      }

      .btn-primary:hover,
      .btn-primary:focus {
        background: var(--ss-red-dark);
        border-color: var(--ss-red-dark);
      }

      .btn-outline-primary {
        color: var(--ss-red);
        border-color: var(--ss-red);
      }

      .btn-outline-primary:hover {
        background: var(--ss-red);
        border-color: var(--ss-red);
      }

      .btn-outline-success {
        color: var(--ss-green);
        border-color: var(--ss-green);
      }

      .btn-outline-success:hover {
        background: var(--ss-green);
        border-color: var(--ss-green);
      }

      .recipient-name {
        display: inline-block;
        font-size: 2.6rem;
        font-weight: 700;
        color: var(--ss-red);
        word-break: break-word;
      }

      .recipient-name.reveal {
        animation: pop 0.5s ease-out;
      }

      @keyframes pop {
        0% { transform: scale(0.4); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); }
      }

      .panel-box {
        border: 1px solid #e3e6ea;
        background-color: #f6f8fa;
        padding: 16px;
        border-radius: 12px;
        margin-top: 28px;
      }

      .fade-in {
        opacity: 0;
        transition: opacity 1s ease-in;
      }

      .fade-in.show {
        opacity: 1;
      }

      .hidden {
        display: none;
      }

      .actions {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="content">{% block content %}{% endblock %}</div>
  </body>
</html>
