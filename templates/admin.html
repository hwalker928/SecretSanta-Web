{% extends "base.html" %} {% block content %}
<h2>Admin</h2>
<p>
  {{ count }} of {{ people|length }} people haven't opened their link and drawn
  yet.
</p>
<table class="table table-sm text-left">
  <thead>
    <tr><th>Name</th><th>Status</th><th>Private link</th></tr>
  </thead>
  <tbody>
    {% for p in people %}
    <tr>
      <td>{{ p.name }}</td>
      <td>
        {% if p.assigned %}<span class="text-success">Drawn</span>{% else %}<span class="text-muted">Waiting</span>{% endif %}
      </td>
      <td>
        <input class="form-control form-control-sm" readonly value="{{ p.link }}" onclick="this.select()" />
        <button class="btn btn-outline-primary btn-sm" onclick="copyLink(this, '{{ p.link }}')">Copy</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<script>
  function copyLink(btn, link) {
    navigator.clipboard.writeText(link).then(() => {
      btn.innerText = "Copied!";
      setTimeout(() => (btn.innerText = "Copy"), 1500);
    });
  }
</script>
{% endblock %}
