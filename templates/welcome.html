{% extends "base.html" %} {% block content %}
<img src="{{ url_for('static', filename='ss.svg') }}" alt="Secret Santa" />
<h2>Hello {{ person }}!</h2>
{% if already_drawn %}
<p>Welcome back. Tap below to see who you are buying for.</p>
{% else %}
<p>
  Ready to find out who you are buying for? The budget is
  <b>{{ budget }}</b>.
</p>
{% endif %}
<form method="post" action="/u/{{ token }}/draw">
  <button type="submit" class="btn btn-primary btn-lg">
    {% if already_drawn %}Show me{% else %}Let's go!{% endif %}
  </button>
</form>
{% endblock %}
